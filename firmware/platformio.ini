; ENG401 survey device firmware.
;   esp32       real sensors (hardware team builds/flashes this)
;   esp32-mock  same app, simulated sensors (Wokwi / development without hardware)
;   diag        diagnostic firmware: checks wiring and every sensor, prints a report
;   native      host-side unit tests for pure logic in lib/ (pio test -e native)

[platformio]
default_envs = esp32, esp32-mock, diag

[env]
; scan library sources too, so lib -> lib dependencies (hal -> nmea -> timeutil) resolve
lib_ldf_mode = deep+

[esp32_base]
platform = espressif32@6.9.0
framework = arduino
board = esp32dev
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit BME280 Library@2.2.4
    adafruit/Adafruit MPU6050@2.2.6
    pololu/VL53L0X@1.3.1
build_flags =
    -Wall
    -DFW_VERSION=\"0.2.0\"

[env:esp32]
extends = esp32_base
build_src_filter = +<app/>
build_flags =
    ${esp32_base.build_flags}
    -DUSE_MOCK=0

[env:esp32-mock]
extends = esp32_base
build_src_filter = +<app/>
build_flags =
    ${esp32_base.build_flags}
    -DUSE_MOCK=1

[env:diag]
extends = esp32_base
build_src_filter = +<diag/>
build_flags =
    -Wall
    -DFW_VERSION=\"0.1.1\"
    -DUSE_MOCK=0

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -DUNITY_INCLUDE_DOUBLE
    -DGOLDEN_DIR=\"$PROJECT_DIR/../shared/golden\"
