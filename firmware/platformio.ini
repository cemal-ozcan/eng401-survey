; ENG401 survey device firmware.
;   esp32       real sensors (hardware team builds/flashes this)
;   esp32-mock  same app, simulated sensors (Wokwi / development without hardware)
;   native      host-side unit tests for pure logic in lib/ (pio test -e native)

[platformio]
default_envs = esp32, esp32-mock

[esp32_base]
platform = espressif32@6.9.0
framework = arduino
board = esp32dev
monitor_speed = 115200
build_flags =
    -Wall
    -DFW_VERSION=\"0.0.1\"

[env:esp32]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -DUSE_MOCK=0

[env:esp32-mock]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -DUSE_MOCK=1

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
